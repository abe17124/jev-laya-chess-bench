<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JEV vs LAYA — live chess</title>
  <meta name="description" content="Live Jev vs Laya chess — Play starts a new game; Replay watches the last one." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="title">JEV vs LAYA — live</h1>
    <a class="gh-link" href="https://github.com/abe17124/jev-laya-chess-bench" target="_blank" rel="noopener">github</a>
  </header>

  <section class="players" id="players" aria-label="Players">
    <div class="player-card" id="cardJev" data-player="jev">
      <div class="ascii-box">
        <div class="box-body">
          <div class="who"><span class="pname">JEV</span> <span class="color-tag" id="jevColor">—</span></div>
          <div class="wdl" id="jevWdl">live</div>
          <div class="avg" id="jevAvg">lat —</div>
        </div>
      </div>
    </div>
    <div class="vs">vs</div>
    <div class="player-card" id="cardLaya" data-player="laya">
      <div class="ascii-box">
        <div class="box-body">
          <div class="who"><span class="pname">LAYA</span> <span class="color-tag" id="layaColor">—</span></div>
          <div class="wdl" id="layaWdl">live</div>
          <div class="avg" id="layaAvg">lat —</div>
        </div>
      </div>
    </div>
  </section>

  <section class="scoreboard-strip" id="scoreboardStrip" aria-label="Status">
    <span id="scoreLine">press PLAY for a new live game</span>
  </section>

  <section class="winner-box" id="winnerBox" hidden aria-live="polite"></section>

  <main class="stage">
    <section class="board-panel">
      <div class="turn-banner" id="turnBanner">ready</div>
      <div id="board" class="board"></div>
      <div class="controls" id="controls">
        <button type="button" id="btnPlay" class="primary big" title="New live game">▶ PLAY</button>
        <button type="button" id="btnReplay" class="big replay" disabled title="Replay last completed game">↺ REPLAY</button>
        <span class="speed" aria-label="Playback speed">
          <button type="button" data-speed="slow" title="~1.4s / ply">Slow</button>
          <button type="button" data-speed="normal" class="active" title="~0.85s / ply">Normal</button>
          <button type="button" data-speed="fast" title="~0.35s / ply">Fast</button>
        </span>
        <span class="ply-readout" id="plyLabel">ply 0</span>
      </div>
    </section>

    <aside class="hud-panel">
      <pre class="ascii-label">┌─ NOW ─────────────┐</pre>
      <div class="now" id="nowBlock">
        <div class="now-move" id="hMove">—</div>
        <div class="now-meta">
          <span id="hPlayer">—</span>
          <span id="hLat">—</span>
        </div>
        <div class="now-result" id="resultBadge" hidden></div>
      </div>
      <details class="more">
        <summary>details</summary>
        <div class="hud-row"><span>uci</span><span class="mono" id="hUci">—</span></div>
        <div class="hud-row"><span>conf</span><span id="hConf">—</span></div>
        <div class="probs" id="probs"></div>
      </details>
      <details class="more replay-opt" id="replayBox">
        <summary>last replay (optional)</summary>
        <div class="game-picker" id="matchList" role="listbox" aria-label="Recorded games"></div>
        <div class="meta-block" id="matchMeta"></div>
      </details>
    </aside>
  </main>

  <footer class="site-footer">
    <span id="footerNote">live via /api/game/stream · Pages alone is static</span>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
