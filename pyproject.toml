[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-laya-chess-bench"
version = "0.1.0"
description = "Head-to-head chess bench: TypeSafe Jev vs Laya (System One Choice decisions)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-chess>=1.999",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.0", "torch>=2.0.0", "transformers>=4.48.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
chess-bench = "chess_bench.cli:main"

[tool.setuptools.packages.find]
include = ["chess_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
